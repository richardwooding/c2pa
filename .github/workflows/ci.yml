name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Lower bound matches the go.mod floor; stable proves forward-compat.
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -timeout 120s -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # The interop gate: everything Sign writes is verified by c2pa-rs's c2patool,
  # the reference implementation. Our own validator is lenient where c2pa-rs is
  # strict (no first-action rule, no ingredient-hash check), so this is what
  # proves the output is consumable by anyone else. The version pin moves in
  # lockstep with corpus.yml; C2PA_REQUIRE_C2PATOOL means the job cannot pass
  # by skipping.
  interop:
    name: c2patool interop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install c2patool
        env:
          C2PATOOL_VERSION: v0.27.16
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-${C2PATOOL_VERSION}/c2patool-${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          install -m 0755 "$(find /tmp -name c2patool -type f | head -1)" /usr/local/bin/c2patool
          c2patool --version
      - name: Sign, then verify with c2patool
        env:
          C2PA_REQUIRE_C2PATOOL: "1"
        run: go test -run 'TestSignInterop' -v -timeout 300s .
